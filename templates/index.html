<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF QA Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Fallback inline styles in case CSS file doesn't load */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b2e 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <header>📄 RAG Based Chatbot</header>

    <div class="chat-container" id="chat">
        <div class="message bot">
            <center>Hello! Upload PDFs and ask me anything from them.</center>
        </div>
    </div>

    <div class="bottom-bar">
        <label class="btn upload-btn">
            📤 Upload PDFs
            <input type="file" id="fileInput" accept="application/pdf" multiple>
        </label>

        <button class="btn docs-btn" id="docsBtn">Documents</button>

        <button class="btn clear-btn" id="clearBtn">Empty Data</button>

        <input class="question-box" id="questionInput" placeholder="Ask a question…">

        <button class="btn send-btn" onclick="sendQuestion()">Send ➤</button>
    </div>

    <!-- Documents Modal -->
    <div id="docsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <h2>Uploaded Documents</h2>
            <div class="doc-list" id="docList">
                <div class="empty-docs">
                    <div class="empty-docs-icon">📁</div>
                    <div class="empty-docs-text">No documents uploaded yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const fileInput = document.getElementById("fileInput");
        const questionInput = document.getElementById("questionInput");
        const docsModal = document.getElementById("docsModal");
        const docsBtn = document.getElementById("docsBtn");
        const clearBtn = document.getElementById("clearBtn");
        const modalClose = document.getElementById("modalClose");
        const docList = document.getElementById("docList");

        const BACKEND = "http://127.0.0.1:5000";

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function loadDocuments() {
            const res = await fetch(BACKEND + "/documents");
            if (!res.ok) return;
            const docs = await res.json();

            if (docs.length === 0) {
                docList.innerHTML = `
                    <div class="empty-docs">
                        <div class="empty-docs-icon">📁</div>
                        <div class="empty-docs-text">No documents uploaded yet</div>
                    </div>
                `;
            } else {
                docList.innerHTML = docs.map(doc => `
                    <div class="doc-item">
                        <div class="doc-item-name">📄 ${doc.filename}</div>
                        <div class="doc-item-date">${new Date(doc.uploaded_at).toLocaleString()}</div>
                    </div>
                `).join('');
            }
        }

        docsBtn.addEventListener("click", () => {
            loadDocuments();
            docsModal.style.display = "block";
        });

        modalClose.addEventListener("click", () => {
            docsModal.style.display = "none";
        });

        window.addEventListener("click", (e) => {
            if (e.target === docsModal) {
                docsModal.style.display = "none";
            }
        });

        clearBtn.addEventListener("click", async () => {
            if (!confirm("Clear all uploaded documents and indexed data? This cannot be undone.")) return;
            addMessage("🧹 Clearing database...", "bot");
            try {
                const res = await fetch(BACKEND + "/clear", { method: "POST" });
                const data = await res.json();
                if (res.ok) {
                    addMessage(`✅ ${data.message}`, "bot");
                    loadDocuments();
                } else {
                    addMessage(`❌ Failed to clear database: ${data.error || 'Unexpected error'}`, "bot");
                }
            } catch (err) {
                addMessage(`❌ Error clearing database: ${err.message}`, "bot");
            }
        });

        fileInput.addEventListener("change", async () => {
            const files = Array.from(fileInput.files);
            if (!files.length) return;

            addMessage(`📤 Uploading ${files.length} PDF(s)…`, "bot");

            const formData = new FormData();
            files.forEach(file => formData.append("files", file));

            const res = await fetch(BACKEND + "/upload", {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            if (res.ok) {
                addMessage(`✅ Uploaded ${data.added_documents.length} document(s). ${data.skipped_documents.length} skipped.`, "bot");
                loadDocuments();
            } else {
                addMessage(`❌ Upload failed: ${data.error || 'Unexpected error'}`, "bot");
            }

            fileInput.value = "";
        });

        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            addMessage(question, "user");
            questionInput.value = "";

            const res = await fetch(BACKEND + "/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });

            const data = await res.json();
            addMessage(data.answer, "bot");
        }

        questionInput.addEventListener("keydown", e => {
            if (e.key === "Enter") sendQuestion();
        });

        window.addEventListener("load", loadDocuments);
    </script>

</body>

</html>
